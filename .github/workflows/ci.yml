name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json

      # Root package only: evals/ and website/ deps are ~1800 packages these checks never load.
      - run: pnpm install --frozen-lockfile --filter lessons-learned

      # Trial-sandbox tests assert PATH-stub resolution under a login zsh (the shell macOS
      # agents and nix-darwin reset PATH in), which ubuntu-latest does not ship by default.
      - run: sudo apt-get update && sudo apt-get install -y zsh

      - run: pnpm run format:check

      - run: pnpm run lint --format=github

      - run: pnpm run typecheck

      - run: pnpm test

  check-docs:
    name: Validate docs build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      # Gate steps rather than the job so the check reports success when skipped.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            docs:
              - 'website/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

      - uses: actions/checkout@v4
        if: steps.filter.outputs.docs != 'false'

      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.docs != 'false'

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.docs != 'false'
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            website/package.json

      - name: Install dependencies
        if: steps.filter.outputs.docs != 'false'
        run: pnpm install --frozen-lockfile --filter lessons-learned-docs

      - name: Build docs
        if: steps.filter.outputs.docs != 'false'
        run: pnpm docs:build
